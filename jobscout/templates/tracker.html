<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#EFF2F5;
  --ink:#16202A; --muted:#5C6975; --line:#DCE2E8;
  --accent:#1F5F8B; --crit:#A3282B;
  --font-display:"Source Serif 4",Georgia,serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141A; --surface:#171F27; --surface-2:#1E2831;
  --ink:#E7ECF1; --muted:#95A2AE; --line:#28333E;
  --accent:#72B4DD; --crit:#E58183; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#171F27; --surface-2:#1E2831;
  --ink:#E7ECF1; --muted:#95A2AE; --line:#28333E;
  --accent:#72B4DD; --crit:#E58183; color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,4.4vw,36px);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:24px 0 20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;min-width:0}
.stat .n{font-family:var(--font-data);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .k{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;margin-top:5px}
.stat.urgent .n{color:var(--crit)}
.stat.strong .n{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.chip{font:inherit;font-size:13px;background:var(--surface);color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.spacer{flex:1 1 auto;min-width:0}
.sortsel{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:5px 9px}
.list{display:flex;flex-direction:column;gap:11px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;
  align-items:start;min-width:0}
.card.s-strong{border-left-color:var(--accent)}
.card.s-soon{border-left-color:var(--crit)}
.card.s-done{opacity:.6}
.inst{font-family:var(--font-display);font-size:18px;font-weight:600;margin:0}
.role{margin:3px 0 0;font-size:14.5px}
.role a{color:var(--accent);text-decoration:none}
.role a:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:12.5px;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:4px 10px}
.meta .flag{color:var(--crit)}
.rail{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0}
.score{font-family:var(--font-data);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.score small{font-size:11px;color:var(--muted)}
.due{font-family:var(--font-data);font-size:12.5px;color:var(--muted);white-space:nowrap}
.due.soon{color:var(--crit);font-weight:500}
.due.past{text-decoration:line-through}
select.status{font:inherit;font-size:12.5px;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--line);border-radius:7px;padding:4px 7px;max-width:140px}
.docs{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:9px;font-size:13px;color:var(--muted)}
.docs b{color:var(--ink);font-weight:500}
.note{grid-column:1/-1}
.note textarea{width:100%;font:inherit;font-size:13px;background:transparent;color:var(--ink);
  border:1px solid var(--line);border-radius:7px;padding:7px 9px;resize:vertical;min-height:36px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:30px 24px}
.empty h2{font-family:var(--font-display);font-size:19px;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 6px;max-width:60ch}
footer{color:var(--muted);font-size:12.5px;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:560px){.card{grid-template-columns:1fr}.rail{align-items:flex-start;flex-direction:row;flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>__HEADING__</h1>
    <p class="sub">__BLURB__</p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="bar" id="bar">
    <button class="chip" data-f="live" aria-pressed="true">Live</button>
    <button class="chip" data-f="strong" aria-pressed="false">Strong fits</button>
    <button class="chip" data-f="soon" aria-pressed="false">Closing soon</button>
    <button class="chip" data-f="teaching" aria-pressed="false">Teaching track</button>
    <button class="chip" data-f="all" aria-pressed="false">Everything</button>
    <span class="spacer"></span>
    <label for="sort" style="font-size:13px;color:var(--muted)">Sort</label>
    <select class="sortsel" id="sort">
      <option value="deadline">By deadline</option>
      <option value="score">By fit score</option>
      <option value="inst">By institution</option>
    </select>
  </div>
  <div class="list" id="list"></div>
  <footer id="foot"></footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  var KEY = "jobscout:" + (document.title || "tracker");
  var STATUSES = ["watching","drafting","submitted","interview","offer","closed","passed"];
  var DONE = { closed:1, passed:1, offer:1 };
  var listEl = document.getElementById("list");
  var statsEl = document.getElementById("stats");
  var footEl = document.getElementById("foot");
  var sortEl = document.getElementById("sort");
  var filter = "live", sortBy = "deadline";

  var rows = [];
  try { rows = JSON.parse(document.getElementById("data").textContent) || []; }
  catch (e) { rows = []; }

  // Per-browser overlay of status and notes. The JSON file stays the source
  // of truth for everything else, so a rescan never clobbers these edits.
  var local = {};
  try { local = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { local = {}; }
  rows.forEach(function (r) {
    var o = local[r.id];
    if (o) {
      if (o.status) r.status = o.status;
      if (typeof o.notes === "string") r.notes = o.notes;
    }
  });

  function persist(id, patch) {
    local[id] = Object.assign({}, local[id], patch);
    try { localStorage.setItem(KEY, JSON.stringify(local)); } catch (e) { /* private mode */ }
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function daysTo(iso) {
    if (!iso) return null;
    var t = Date.parse(iso + "T23:59:59");
    return isNaN(t) ? null : Math.ceil((t - Date.now()) / 86400000);
  }
  function dueText(iso) {
    var d = daysTo(iso);
    if (d === null) return { text:"no deadline given", cls:"" };
    var when = new Date(iso + "T12:00:00").toLocaleDateString(undefined, { month:"short", day:"numeric" });
    if (d < 0) return { text: when + " · closed", cls:"past" };
    if (d === 0) return { text: when + " · today", cls:"soon" };
    return { text: when + " · " + d + (d === 1 ? " day" : " days"), cls: d <= 14 ? "soon" : "" };
  }
  function visible() {
    return rows.filter(function (r) {
      var d = daysTo(r.deadline);
      if (filter === "all") return true;
      if (filter === "teaching") return /teach|lectur|instruct/i.test(String(r.category) + " " + String(r.role)) && !DONE[r.status];
      if (filter === "strong") return (r.score || 0) >= 80 && !DONE[r.status];
      if (filter === "soon") return !DONE[r.status] && d !== null && d >= 0 && d <= 21;
      return !DONE[r.status] && (d === null || d >= 0);
    });
  }
  function sorted(list) {
    var a = list.slice();
    if (sortBy === "score") a.sort(function (x,y){ return (y.score||0)-(x.score||0); });
    else if (sortBy === "inst") a.sort(function (x,y){ return String(x.institution||"").localeCompare(String(y.institution||"")); });
    else a.sort(function (x,y) {
      var dx = daysTo(x.deadline), dy = daysTo(y.deadline);
      if (dx === null && dy === null) return (y.score||0)-(x.score||0);
      if (dx === null) return 1;
      if (dy === null) return -1;
      return dx - dy;
    });
    return a;
  }
  function renderStats() {
    var live = rows.filter(function (r) { var d = daysTo(r.deadline); return !DONE[r.status] && (d === null || d >= 0); });
    var cells = [
      ["", live.length, "open now"],
      ["urgent", live.filter(function (r){ var d=daysTo(r.deadline); return d!==null && d<=14; }).length, "closing in 14 days"],
      ["strong", live.filter(function (r){ return (r.score||0) >= 80; }).length, "scoring 80+"],
      ["", rows.filter(function (r){ return r.status==="submitted"||r.status==="interview"; }).length, "submitted or interviewing"]
    ];
    statsEl.innerHTML = cells.map(function (c) {
      return '<div class="stat ' + c[0] + '"><div class="n">' + c[1] + '</div><div class="k">' + c[2] + "</div></div>";
    }).join("");
  }
  function card(r) {
    var due = dueText(r.deadline), d = daysTo(r.deadline), cls = "card";
    if (DONE[r.status]) cls += " s-done";
    else if (d !== null && d >= 0 && d <= 14) cls += " s-soon";
    else if ((r.score||0) >= 80) cls += " s-strong";
    var bits = [];
    if (r.unit) bits.push(esc(r.unit));
    if (r.location) bits.push(esc(r.location));
    if (r.category) bits.push(esc(r.category));
    if (r.sponsorship === "no") bits.push('<span class="flag">will not sponsor</span>');
    else if (r.sponsorship === "limited") bits.push('<span class="flag">sponsorship limited</span>');
    if (r.citizenship) bits.push('<span class="flag">citizenship required</span>');
    if (r.source) bits.push("via " + esc(r.source));
    var title = r.url
      ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.role || "Position") + "</a>"
      : esc(r.role || "Position");
    var opts = STATUSES.map(function (s) {
      return '<option value="' + s + '"' + (r.status === s ? " selected" : "") + ">" + s + "</option>";
    }).join("");
    return '<article class="' + cls + '" data-id="' + esc(r.id) + '">' +
      '<div class="who"><p class="inst">' + esc(r.institution || "Unnamed") + "</p>" +
      '<p class="role">' + title + "</p>" +
      (bits.length ? '<p class="meta">' + bits.join('<span aria-hidden="true">·</span>') + "</p>" : "") + "</div>" +
      '<div class="rail"><div class="score">' + (r.score == null ? "–" : r.score) + " <small>fit</small></div>" +
      '<div class="due ' + due.cls + '">' + esc(due.text) + "</div>" +
      '<select class="status" aria-label="Status">' + opts + "</select></div>" +
      (r.docs ? '<div class="docs"><b>Needs</b> ' + esc(r.docs) + "</div>" : "") +
      '<div class="note"><textarea placeholder="Notes" rows="1">' + esc(r.notes || "") + "</textarea></div></article>";
  }
  function render() {
    renderStats();
    var list = sorted(visible());
    if (!rows.length) {
      listEl.innerHTML = '<div class="empty"><h2>Nothing here yet</h2>' +
        "<p>Run <code>jobscout scan</code> to search for positions, then rebuild this page " +
        "with <code>jobscout build</code>.</p></div>";
    } else if (!list.length) {
      listEl.innerHTML = '<div class="empty"><h2>Nothing matches this filter</h2>' +
        "<p>Try <em>Everything</em> to include closed and passed positions.</p></div>";
    } else {
      listEl.innerHTML = list.map(card).join("");
    }
    var n = rows.length;
    footEl.textContent = (n ? n + " position" + (n===1?"":"s") + " tracked" : "No positions yet") +
      " · built __BUILT__ · status and notes are saved in this browser only.";
  }
  listEl.addEventListener("change", function (e) {
    var sel = e.target.closest("select.status");
    if (!sel) return;
    var art = sel.closest("article"), id = art && art.dataset.id;
    if (!id) return;
    rows.forEach(function (r) { if (r.id === id) r.status = sel.value; });
    persist(id, { status: sel.value });
    render();
  });
  listEl.addEventListener("focusout", function (e) {
    var ta = e.target.closest(".note textarea");
    if (!ta) return;
    var art = ta.closest("article"), id = art && art.dataset.id;
    if (!id) return;
    rows.forEach(function (r) { if (r.id === id) r.notes = ta.value; });
    persist(id, { notes: ta.value });
  });
  document.getElementById("bar").addEventListener("click", function (e) {
    var b = e.target.closest(".chip");
    if (!b) return;
    filter = b.dataset.f;
    Array.prototype.forEach.call(this.querySelectorAll(".chip"), function (c) {
      c.setAttribute("aria-pressed", String(c === b));
    });
    render();
  });
  sortEl.addEventListener("change", function () { sortBy = sortEl.value; render(); });
  render();
})();
</script>
</body>
</html>
