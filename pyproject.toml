[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobscout"
version = "0.1.0"
description = "Turn a CV into a job search that runs itself: a scored, tracked pipeline of live postings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Suraj A. Yadav" }]
keywords = ["job search", "academic jobs", "cv", "claude", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
all = ["pypdf>=4.0", "python-docx>=1.1"]

[project.urls]
Homepage = "https://github.com/SAY70/jobscout"
Issues = "https://github.com/SAY70/jobscout/issues"

[project.scripts]
jobscout = "jobscout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jobscout"]

[tool.hatch.build]
include = ["jobscout/templates/*.html"]
